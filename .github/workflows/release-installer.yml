name: Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust engine
        run: .\_estudio\soporte\engine\build-engine.cmd

      - name: Install UI dependencies and build
        working-directory: .
        run: |
          bun ci
          cd _estudio/installer/ui
          bun run build

      - name: Restore solution
        run: dotnet restore _estudio/installer/EstudioSocratico.Installer.sln

      - name: Run unit tests
        run: dotnet test _estudio/installer/src/EstudioSocratico.Configurator.Tests/EstudioSocratico.Configurator.Tests.csproj --configuration Release

      - name: Publish App
        run: |
          dotnet publish _estudio/installer/src/EstudioSocratico.Configurator.App/EstudioSocratico.Configurator.App.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false `
            --output _estudio/installer/artifacts/publish/app

      - name: Publish Elevated Worker
        run: |
          dotnet publish _estudio/installer/src/EstudioSocratico.Configurator.Elevated/EstudioSocratico.Configurator.Elevated.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false `
            --output _estudio/installer/artifacts/publish/app

      - name: Build MSI Package
        run: dotnet build _estudio/installer/packaging/wix-burn/EstudioSocratico.Configurator.Package.wixproj --configuration Release

      - name: Build Bundle Package
        run: dotnet build _estudio/installer/packaging/wix-burn/EstudioSocratico.Setup.Bundle.wixproj --configuration Release

      - name: Generate Checksum
        shell: pwsh
        run: |
          $buildExe = Get-ChildItem "_estudio/installer/packaging/wix-burn/bin/x64/Release/Estudio-Socratico-Setup-v*.exe" | Select-Object -First 1
          if (-not $buildExe) {
            throw "Installer exe not found!"
          }

          Write-Host "Found installer at: $($buildExe.FullName)"
          $hash = (Get-FileHash $buildExe.FullName -Algorithm SHA256).Hash.ToLower()
          $hash | Out-File "$($buildExe.FullName).sha256" -Encoding ascii -NoNewline

          "EXE_PATH=$($buildExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SHA_PATH=$($buildExe.FullName).sha256" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "Estudio Socrático 2.0 — Update Validation Hotfix"
          body: |
            # Estudio Socrático 2.0 — Update Validation Hotfix

            ## Cambios

            - El modo Actualizar ahora reinstala la extensión de VS Code si hay una versión nueva.
            - El Activity Bar de VS Code usa el nuevo branding.
            - El diagnóstico reporta versión pública, versión interna y build instalado de forma clara.
            - Ajustes de nombre visible del producto a Estudio Socrático Instalador.
            - Validación del modelo multi-dispositivo: misma cuenta GitHub + mismo alias usa el mismo repo workspace.

            ## Sin cambios destructivos

            No cambia datos del usuario, ejercicios, logs, API keys ni repos remotos.
          draft: false
          prerelease: false
          files: |
            ${{ env.EXE_PATH }}
            ${{ env.SHA_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
