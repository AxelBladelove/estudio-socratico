name: Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install UI dependencies and build
        working-directory: _estudio/installer/ui
        run: |
          npm ci
          npm run build

      - name: Restore solution
        run: dotnet restore _estudio/installer/EstudioSocratico.Installer.sln

      - name: Run unit tests
        run: dotnet test _estudio/installer/src/EstudioSocratico.Configurator.Tests/EstudioSocratico.Configurator.Tests.csproj --configuration Release

      - name: Publish App
        run: |
          dotnet publish _estudio/installer/src/EstudioSocratico.Configurator.App/EstudioSocratico.Configurator.App.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false `
            --output _estudio/installer/artifacts/publish/app

      - name: Publish Elevated Worker
        run: |
          dotnet publish _estudio/installer/src/EstudioSocratico.Configurator.Elevated/EstudioSocratico.Configurator.Elevated.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false `
            --output _estudio/installer/artifacts/publish/app

      - name: Build MSI Package
        run: dotnet build _estudio/installer/packaging/wix-burn/EstudioSocratico.Configurator.Package.wixproj --configuration Release

      - name: Build Bundle Package
        run: dotnet build _estudio/installer/packaging/wix-burn/EstudioSocratico.Setup.Bundle.wixproj --configuration Release

      - name: Generate Checksum
        shell: pwsh
        run: |
          $buildExe = Get-ChildItem "_estudio/installer/packaging/wix-burn/bin/x64/Release/Estudio-Socratico-Setup-v*.exe" | Select-Object -First 1
          if (-not $buildExe) {
            throw "Installer exe not found!"
          }

          Write-Host "Found installer at: $($buildExe.FullName)"
          $hash = (Get-FileHash $buildExe.FullName -Algorithm SHA256).Hash.ToLower()
          $hash | Out-File "$($buildExe.FullName).sha256" -Encoding ascii -NoNewline

          "EXE_PATH=$($buildExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SHA_PATH=$($buildExe.FullName).sha256" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare Release Metadata
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $releaseName = "Estudio Socrático 2.0 Stable"
          $releaseNotesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"

          if ("${{ github.ref_name }}" -eq "v2.0.11") {
            $releaseName = "Estudio Socrático 2.0 — Branding Update"
            @'
# Estudio Socrático 2.0 — Branding Update

Actualización visual menor de Estudio Socrático 2.0.

## Cambios

- Nuevo logo oficial de Estudio Socrático.
- Nuevo icono del configurador.
- Nuevo icono del instalador de Windows.
- Nuevo icono transparente para taskbar, Alt-Tab y Start Menu.
- Nuevo icono de la extensión de VS Code.
- Nuevo icono monocromático para el Activity Bar de VS Code.
- Limpieza de assets antiguos y duplicados.

## Sin cambios funcionales

Esta versión no cambia el backend, el updater, el flujo de instalación, GitHub, Exercism ni los datos del usuario.
'@ | Set-Content $releaseNotesPath -Encoding utf8
          }
          else {
            "Release automática del instalador de Estudio Socrático 2.0." | Set-Content $releaseNotesPath -Encoding utf8
          }

          "RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_BODY_PATH=$releaseNotesPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: ${{ env.RELEASE_BODY_PATH }}
          draft: false
          prerelease: false
          files: |
            ${{ env.EXE_PATH }}
            ${{ env.SHA_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
